apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhorizon-db
  namespace: rhorizon
  labels:
    app: rhorizon-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhorizon-db
  template:
    metadata:
      labels:
        app: rhorizon-db
    spec:
      containers:
      - name: db
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: rhorizon_dev
        - name: POSTGRES_USER
          value: dbadmin
        - name: POSTGRES_PASSWORD
          value: RHZorionDevPass2026!
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: rhorizon
spec:
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: rhorizon-db
