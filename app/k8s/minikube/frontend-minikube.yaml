apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhorizon-frontend
  namespace: rhorizon
  labels:
    app: rhorizon-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhorizon-frontend
  template:
    metadata:
      labels:
        app: rhorizon-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user
      containers:
      - name: frontend
        image: rhorizon-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rhorizon
  labels:
    app: rhorizon-frontend
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: rhorizon-frontend
