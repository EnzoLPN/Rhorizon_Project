apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rhorizon
data:
  DB_HOST: "rhorizon-nonprod-postgres.c5g6kca8wtnj.eu-west-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "rhorizon_dev"
  DB_USER: "dbadmin"
  S3_BUCKET_NAME: "rhorizon-app-assets"
  AWS_REGION: "eu-west-1"
  USE_IAM_AUTH: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: rhorizon
type: Opaque
data:
  DB_PASSWORD: "UkhaMHJpb25EZXZQYXNzMjAyNiE="
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhorizon-backend-sa
  namespace: rhorizon
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::083127296598:role/rhorizon-nonprod-backend-s3-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhorizon-backend
  namespace: rhorizon
  labels:
    app: rhorizon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhorizon-backend
  template:
    metadata:
      labels:
        app: rhorizon-backend
    spec:
      serviceAccountName: rhorizon-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: backend
        image: "116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhorizon/backend:latest"
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/liveness
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rhorizon
  labels:
    app: rhorizon-backend
spec:
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: rhorizon-backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rhorizon-backend-hpa
  namespace: rhorizon
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rhorizon-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
