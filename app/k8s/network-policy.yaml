apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-frontend
  namespace: rhorizon
spec:
  podSelector:
    matchLabels:
      app: rhorizon-frontend
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic to frontend pods on port 8080 from the ALB (any source)
  - ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: rhorizon
spec:
  podSelector:
    matchLabels:
      app: rhorizon-backend
  policyTypes:
  - Ingress
  ingress:
  # Restrict ingress to backend pods on port 5000; only allow it from frontend pods
  - from:
    - podSelector:
        matchLabels:
          app: rhorizon-frontend
    ports:
    - protocol: TCP
      port: 5000
