apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: rhorizon
data:
  DB_HOST: "rhorizon-db-endpoint-placeholder.eu-west-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "rhorizon_dev"
  DB_USER: "dbadmin"
  S3_BUCKET_NAME: "rhorizon-nonprod-app-assets"
  AWS_REGION: "eu-west-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: rhorizon
type: Opaque
data:
  # Base64 encoded representation of: RHZorionDevPass2026!
  DB_PASSWORD: "Ukhab3Jpb25EZXZQYXNzMjAyNiE="
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhorizon-backend-sa
  namespace: rhorizon
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/rhorizon-<ENV>-backend-s3-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhorizon-backend
  namespace: rhorizon
  labels:
    app: rhorizon-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhorizon-backend
  template:
    metadata:
      labels:
        app: rhorizon-backend
    spec:
      serviceAccountName: rhorizon-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: backend
        # Placeholder ECR image path to be updated during build/release pipeline
        image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/rhorizon-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/liveness
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: rhorizon
  labels:
    app: rhorizon-backend
spec:
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: rhorizon-backend
