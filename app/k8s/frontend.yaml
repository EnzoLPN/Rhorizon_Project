apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhorizon-frontend
  namespace: rhorizon
  labels:
    app: rhorizon-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rhorizon-frontend
  template:
    metadata:
      labels:
        app: rhorizon-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        # nginxinc/nginx-unprivileged:alpine image runs as uid 101
        runAsUser: 101
      containers:
      - name: frontend
        image: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/rhorizon-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: rhorizon
  labels:
    app: rhorizon-frontend
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: rhorizon-frontend
