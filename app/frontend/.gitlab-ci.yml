stages:
  - build
  - scan
  - deploy

# --- AWS OIDC Authentication Template ---
.aws_oidc_auth:
  id_tokens:
    AWS_JWT_TOKEN:
      aud: https://gitlab.com
  before_script:
    - mkdir -p ~/.aws
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web_identity_token
    - echo "${AWS_JWT_TOKEN}" > "${AWS_WEB_IDENTITY_TOKEN_FILE}"
    - export AWS_ROLE_ARN="arn:aws:iam::116101833976:role/shared-gitlab-ci-role"
    - export AWS_DEFAULT_REGION="eu-west-1"

# --- Frontend: Build & Push to AWS ECR ---
frontend_build:
  extends: .aws_oidc_auth
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 116101833976.dkr.ecr.eu-west-1.amazonaws.com
    - docker build -t 116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:$CI_COMMIT_SHORT_SHA ./app/frontend
    - docker push 116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- Sécurité : Scan Image (Trivy) ---
frontend_image_scan:
  extends: .aws_oidc_auth
  stage: scan
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 116101833976.dkr.ecr.eu-west-1.amazonaws.com
    - docker run --rm aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# --- Frontend: Deploy (Cross-Account to nonprod EKS) ---
deploy_frontend_nonprod:
  extends: .aws_oidc_auth
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    # 1. Installer l'AWS CLI pour l'assume-role et kubeconfig
    - apk add --no-cache aws-cli
    # 2. Endosser temporairement le rôle d'administration nonprod
    - ASSUME_OUTPUT=$(aws sts assume-role --role-arn "arn:aws:iam::083127296598:role/OrganizationAccountAccessRole" --role-session-name "EKSFrontendDeploy" --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
    - export AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUTPUT" | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUTPUT" | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo "$ASSUME_OUTPUT" | awk '{print $3}')
    # 3. Mettre à jour kubeconfig et lancer la mise à jour progressive
    - aws eks update-kubeconfig --name nonprod-eks-cluster --region eu-west-1
    - kubectl set image deployment/rhorizon-frontend frontend=116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:$CI_COMMIT_SHORT_SHA -n rhorizon
    - kubectl rollout status deployment/rhorizon-frontend -n rhorizon --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
