name: App Pipeline

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  static-analysis:
    name: 🔍 Static Analysis (SAST/SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd app/backend
          pip install Flask Flask-Cors psycopg2-binary gunicorn boto3 bandit pip-audit

      - name: Run Unit Tests
        run: |
          cd app/backend
          python -m unittest test_app

      - name: Run Bandit (SAST)
        run: |
          bandit -r app/backend/ -ll

      - name: Run Pip-Audit (SCA)
        run: |
          pip install pip-audit
          pip-audit -r app/backend/requirements.txt

      - name: Run Trivy FS Scan (Frontend)
        run: |
          docker run --rm -v ${{ github.workspace }}:/apps aquasec/trivy:latest fs --severity HIGH,CRITICAL --exit-code 1 /apps/app/frontend

  containerization:
    name: 🏗️ Containerization (Build & Scan)
    needs: static-analysis
    environment: NON_PROD
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TAG="${SHA_SHORT}-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Unified Image
        run: |
          docker build -t ${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT_NAME }}/app:${{ steps.vars.outputs.tag }} ./app

      - name: Scan Image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed ${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT_NAME }}/app:${{ steps.vars.outputs.tag }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Image
        run: |
          docker push ${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT_NAME }}/app:${{ steps.vars.outputs.tag }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ vars.ECR_REGISTRY }}/${{ vars.PROJECT_NAME }}/app:${{ steps.vars.outputs.tag }}"
          fi

  deployment-nonprod:
    name: 🚀 Continuous Deployment (Non-Prod)
    needs: containerization
    environment: NON_PROD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Assume Cross-Account Role
        run: |
          ASSUME_OUTPUT=$(aws sts assume-role --role-arn "${{ vars.AWS_NONPROD_ROLE_ARN }}" --role-session-name "EKSDeploy" --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
          echo "AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUTPUT" | awk '{print $1}')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUTPUT" | awk '{print $2}')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo "$ASSUME_OUTPUT" | awk '{print $3}')" >> $GITHUB_ENV

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Get AWS Account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Deploy to EKS
        env:
          IMAGE_TAG: ${{ needs.containerization.outputs.image_tag }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: "${{ vars.PROJECT_NAME }}/app"
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ACM_CERT_ARN: ${{ vars.ACM_CERT_ARN }}
          WAF_ACL_ARN: ${{ vars.WAF_ACL_ARN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          APP_ROLE_ARN: "arn:aws:iam::${{ steps.account.outputs.id }}:role/${{ vars.PROJECT_NAME }}-nonprod-app-s3-role"
        run: |
          # 1. Préparer les secrets
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id ${PROJECT_NAME}/nonprod/rds/db-admin-password --query SecretString --output text)
          export DB_PASSWORD_BASE64=$(echo -n "$DB_PASSWORD" | base64)
          
          # 2. Interpolation des manifests
          mkdir -p app/k8s/generated
          envsubst < app/k8s/templates/namespace.yaml.tmpl > app/k8s/generated/namespace.yaml
          envsubst < app/k8s/templates/network-policy.yaml.tmpl > app/k8s/generated/network-policy.yaml
          envsubst < app/k8s/templates/app.yaml.tmpl > app/k8s/generated/app.yaml
          envsubst < app/k8s/templates/ingress.yaml.tmpl > app/k8s/generated/ingress.yaml
          
          # 3. Application K8s
          kubectl apply -f app/k8s/generated/namespace.yaml
          kubectl apply -f app/k8s/generated/network-policy.yaml
          kubectl apply -f app/k8s/generated/app.yaml
          kubectl apply -f app/k8s/generated/ingress.yaml
          
          # 4. Attente du déploiement
          kubectl rollout status deployment/${PROJECT_NAME}-app -n ${PROJECT_NAME} --timeout=180s
          
          # 5. Mise à jour DNS Route 53
          ALB_HOSTNAME=""
          for i in {1..36}; do
            ALB_HOSTNAME=$(kubectl get ingress ${PROJECT_NAME}-ingress -n ${PROJECT_NAME} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ALB_HOSTNAME" ]; then break; fi
            sleep 5
          done
          
          if [ -z "$ALB_HOSTNAME" ]; then echo "❌ Timeout ALB"; exit 1; fi
          
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name "$DOMAIN_NAME" --query "HostedZones[0].Id" --output text | cut -d'/' -f3)
          aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" --change-batch "{
            \"Changes\": [{\"Action\": \"UPSERT\", \"ResourceRecordSet\": {\"Name\": \"${DOMAIN_NAME}.\", \"Type\": \"A\", \"AliasTarget\": {\"HostedZoneId\": \"Z32O12XQLNTSW2\", \"DNSName\": \"${ALB_HOSTNAME}.\", \"EvaluateTargetHealth\": false}}}]
          }"
# Trigger Deployment
