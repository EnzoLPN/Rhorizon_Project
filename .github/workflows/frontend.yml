name: Frontend Pipeline

on:
  push:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'app/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Frontend Build & Push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-image.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set short git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::116101833976:role/shared-gitlab-ci-role
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: 116101833976.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPOSITORY: rhzorion/frontend
          SHA_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: |
          TAG="${SHA_SHORT}-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG ./app/frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG

  scan:
    name: Frontend Container Scan
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::116101833976:role/shared-gitlab-ci-role
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0

        with:
          image-ref: 116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:${{ needs.build.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  deploy:
    name: Frontend Deploy to EKS Nonprod
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::116101833976:role/shared-gitlab-ci-role
          aws-region: eu-west-1

      - name: Assume Cross-Account Nonprod Role
        run: |
          ASSUME_OUTPUT=$(aws sts assume-role --role-arn "arn:aws:iam::083127296598:role/OrganizationAccountAccessRole" --role-session-name "EKSFrontendDeploy" --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
          echo "AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUTPUT" | awk '{print $1}')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUTPUT" | awk '{print $2}')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo "$ASSUME_OUTPUT" | awk '{print $3}')" >> $GITHUB_ENV

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name nonprod-eks-cluster --region eu-west-1

      - name: Deploy to EKS
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          kubectl set image deployment/rhorizon-frontend frontend=116101833976.dkr.ecr.eu-west-1.amazonaws.com/rhzorion/frontend:$IMAGE_TAG -n rhorizon
          kubectl rollout status deployment/rhorizon-frontend -n rhorizon --timeout=120s
