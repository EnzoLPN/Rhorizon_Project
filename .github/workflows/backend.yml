name: Backend Pipeline

on:
  push:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'app/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd app/backend
          pip install Flask Flask-Cors psycopg2-binary gunicorn boto3

      - name: Run Unit Tests
        run: |
          cd app/backend
          python -m unittest test_app

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app/backend/ -ll

      - name: Run Pip-Audit (SCA)
        run: |
          pip install pip-audit
          pip-audit -r app/backend/requirements.txt

  build-and-scan:
    name: Backend Build, Scan & Push
    needs: validate
    environment: NON_PROD
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          TAG="${SHA_SHORT}-$(date +%Y%m%d-%H%M%S)"
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build local image
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG ./app/backend

      - name: Scan Image with Trivy (AVANT le Push)
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          # On ignore les HIGH/CRITICAL qui n'ont pas encore de correctif pour ne pas bloquer inutilement
          # Mais on bloque sur tout ce qui est fixable
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed $ECR_REGISTRY/$ECR_REPOSITORY:$TAG

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Docker Image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ steps.vars.outputs.tag }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ]; then
            echo "Signing backend image with Cosign..."
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE_URI"
          else
            echo "⚠️ Warning: COSIGN_PRIVATE_KEY is not set. Skipping signature."
          fi

  deploy:
    name: Backend Deploy to EKS Nonprod
    needs: build-and-scan
    environment: NON_PROD
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Assume Cross-Account Nonprod Role
        run: |
          ASSUME_OUTPUT=$(aws sts assume-role --role-arn "${{ vars.AWS_NONPROD_ROLE_ARN }}" --role-session-name "EKSBackendDeploy" --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
          echo "AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUTPUT" | awk '{print $1}')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUTPUT" | awk '{print $2}')" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$(echo "$ASSUME_OUTPUT" | awk '{print $3}')" >> $GITHUB_ENV

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: Deploy to EKS
        env:
          IMAGE_TAG: ${{ needs.build-and-scan.outputs.image_tag }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          BACKEND_ROLE_ARN: ${{ vars.BACKEND_ROLE_ARN }}
          ACM_CERT_ARN: ${{ vars.ACM_CERT_ARN }}
          WAF_ACL_ARN: ${{ vars.WAF_ACL_ARN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          echo "🔐 Fetching database password from AWS Secrets Manager..."
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id ${PROJECT_NAME}/nonprod/rds/db-admin-password --query SecretString --output text)
          export DB_PASSWORD_BASE64=$(echo -n "$DB_PASSWORD" | base64)
          ./app/k8s/deploy.sh backend
# Trigger run
